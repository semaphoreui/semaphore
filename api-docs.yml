        type: integer
      title:
        type: string
      project_id:
        type: integer
      position:
        type: integer
      hidden:
        type: boolean
      type:
        type: string
        enum: ["", all]
      sort_column:
        type: string
        enum: [name]
      sort_reverse:
        type: boolean

