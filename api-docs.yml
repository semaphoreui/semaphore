paths:
  /debug/gc:
    post:
      summary: Garbage collector
      description: Run the garbage collector
      responses:
        204:
          description: Successful "OK" reply

  /debug/pprof/dump:
    post:
      tags:
        - admin
      summary: Dump pprof profiling data
      responses:
        204:
          description: Dump started

  /options:
    get:
      tags:
        - admin
      summary: Get all application options
      responses:
        200:
          description: Application options
          schema:
            type: object
    post:
      tags:
        - admin
      summary: Set application option
      parameters:
        - name: Option
          in: body
          required: true
          schema:
            $ref: "#/definitions/Option"
      responses:
        200:
          description: Option set
          schema:
            $ref: "#/definitions/Option"

  /cache:
    delete:
      tags:
        - admin
      summary: Clear global cache
      responses:
        204:
          description: Cache cleared

  /runners:
    get:
      tags:
        - admin
      summary: Get all global runners
      responses:
        200:
          description: Global runners
          schema:
            type: array
            items:
              $ref: "#/definitions/Runner"
    post:
      tags:
        - admin
      summary: Register a global runner
      responses:
        201:
          description: Runner registered
          schema:
            $ref: "#/definitions/Runner"

  /runners/{runner_id}:
    parameters:
      - $ref: "#/parameters/runner_id"
    get:
      tags:
        - admin
      summary: Get a global runner
      responses:
        200:
          description: Runner
          schema:
            $ref: "#/definitions/Runner"
    put:
      tags:
        - admin
      summary: Update a global runner
      parameters:
        - name: Runner
          in: body
          required: true
          schema:
            $ref: "#/definitions/Runner"
      responses:
        204:
          description: Runner updated
    delete:
      tags:
        - admin
      summary: Delete a global runner
      responses:
        204:
          description: Runner deleted

  /runners/{runner_id}/active:
    parameters:
      - $ref: "#/parameters/runner_id"
    post:
      tags:
        - admin
      summary: Set global runner active/inactive
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              active:
                type: boolean
      responses:
        204:
          description: Runner active status updated

  /runners/{runner_id}/cache:
    parameters:
      - $ref: "#/parameters/runner_id"
    delete:
      tags:
        - admin
      summary: Clear global runner cache
      responses:
        204:
          description: Runner cache cleared

  /roles:
    get:
      tags:
        - admin
      summary: Get all global roles
      responses:
        200:
          description: Global roles
          schema:
            type: array
            items:
              $ref: "#/definitions/Role"
    post:
      tags:
        - admin
      summary: Add a global role
      parameters:
        - name: Role
          in: body
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        201:
          description: Role created
          schema:
            $ref: "#/definitions/Role"

  /roles/{role_slug}:
    parameters:
      - $ref: "#/parameters/role_slug"
    get:
      tags:
        - admin
      summary: Get a global role
      responses:
        200:
          description: Role
          schema:
            $ref: "#/definitions/Role"
    put:
      tags:
        - admin
      summary: Update a global role
      parameters:
        - name: Role
          in: body
          required: true
          schema:
            $ref: "#/definitions/Role"
      responses:
        204:
          description: Role updated
    delete:
      tags:
        - admin
      summary: Delete a global role
      responses:
        204:
          description: Role deleted

  /apps/{app_id}:
    parameters:
      - $ref: "#/parameters/app_id"
    get:
      tags:
        - admin
      summary: Get an app
      responses:
        200:
          description: App
          schema:
            $ref: "#/definitions/App"
    put:
      tags:
        - admin
      summary: Update an app
      parameters:
        - name: App
          in: body
          required: true
          schema:
            $ref: "#/definitions/App"
      responses:
        204:
          description: App updated
    delete:
      tags:
        - admin
      summary: Delete an app
      responses:
        204:
          description: App deleted

  /apps/{app_id}/active:
    parameters:
      - $ref: "#/parameters/app_id"
    post:
      tags:
        - admin
      summary: Set app active/inactive
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              active:
                type: boolean
      responses:
        204:
          description: App active status updated

  /tasks:
    get:
      tags:
        - admin
      summary: Get all running and queued tasks (admin)
      responses:
        200:
          description: Tasks
          schema:
            type: array
            items:
              type: object
              properties:
                task_id:
                  type: integer
                project_id:
                  type: integer
                username:
                  type: string
                runner_id:
                  type: integer
                status:
                  type: string
                location:
                  type: string
                  enum: [queue, running]
                runner_name:
                  type: string
                project_name:
                  type: string

  /tasks/{task_id}:
    parameters:
      - $ref: "#/parameters/task_id"
    get:
      tags:
        - admin
      summary: Get a running or queued task (admin)
      responses:
        200:
          description: Task
    delete:
      tags:
        - admin
      summary: Delete (cancel) a running or queued task (admin)
      responses:
        204:
          description: Task deleted

  /subscription:
    get:
      tags:
        - subscription
      summary: Get current subscription
      responses:
        200:
          description: Subscription
    post:
      tags:
        - subscription
      summary: Activate subscription
      responses:
        200:
          description: Subscription activated
    delete:
      tags:
        - subscription
      summary: Delete subscription
      responses:
        204:
          description: Subscription deleted

  /subscription/refresh:
    post:
      tags:
        - subscription
      summary: Refresh subscription
      responses:
        200:
          description: Subscription refreshed

  /integrations/{integration_alias}:
    parameters:
      - $ref: "#/parameters/integration_alias"
    get:
      tags:
        - integration
      summary: Receive integration (webhook) via GET
      security: []
      responses:
        200:
          description: Integration received
    post:
      tags:
        - integration
      summary: Receive integration (webhook) via POST
      security: []
      responses:
        200:
          description: Integration received

  /ping:
    get:
      summary: PING test
      produces:
        - text/plain
      security: []   # No security
      responses:
        200:
          description: Successful "PONG" reply
          schema:
            $ref: "#/definitions/Pong"
          headers:
            content-type:
              type: string
              x-example: text/plain; charset=utf-8

  /ws:
    get:
      summary: Websocket handler
      schemes:
        - ws
        - wss
      responses:
        200:
          description: OK
        401:
          description: not authenticated

  /info:
    get:
      summary: Fetches information about semaphore
      description: you must be authenticated to use this
      responses:
        200:
          description: ok
          schema:
            $ref: "#/definitions/InfoType"

  # Authentication
  /auth/login:
    get:
      tags:
        - authentication
      summary: Fetches login metadata
      description: Fetches metadata for login, such as available OIDC providers
      security: []
      responses:
        200:
          description: Login metadata
          schema:
            $ref: "#/definitions/LoginMetadata"
    post:
      tags:
        - authentication
      summary: Performs Login
      description: Upon success you will be logged in
      security: []   # No security
      parameters:
        - name: Login Body
          in: body
          required: true
          schema:
            $ref: '#/definitions/Login'
      responses:
        204:
          description: You are logged in
        400:
          description: something in body is missing / is invalid

  /auth/logout:
    post:
      tags:
        - authentication
      summary: Destroys current session
      responses:
        204:
          description: Your session was successfully nuked

  /auth/oidc/{provider_id}/login:
    parameters:
      - name: provider_id
        in: path
        type: string
        required: true
        x-example: "mysso"
    get:
      tags:
        - authentication
      summary: Begin OIDC authentication flow and redirect to OIDC provider
      description: The user agent is redirected to this endpoint when chosing to sign in via OIDC
      responses:
        302:
          description: Redirection to the OIDC provider on success, or to the login page on error

  /auth/oidc/{provider_id}/redirect:
    parameters:
      - name: provider_id
        in: path
        type: string
        required: true
        x-example: "mysso"
    get:
      tags:
        - authentication
      summary: Finish OIDC authentication flow, upon succes you will be logged in
      description: The user agent is redirected here by the OIDC provider to complete authentication
      responses:
        302:
          description: Redirection to the Semaphore root URL on success, or to the login page on error

  /auth/verify:
    post:
      tags:
        - authentication
      summary: Verify 2FA (TOTP passcode)
      security: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              passcode:
                type: string
      responses:
        204:
          description: Verification successful
        401:
          description: Invalid passcode

  /auth/recovery:
    post:
      tags:
        - authentication
      summary: Recover session using 2FA recovery code
      security: []
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              recovery_code:
                type: string
      responses:
        204:
          description: Recovery successful
        401:
          description: Invalid recovery code

  # User Tokens
  /user/:
    get:
      tags:
        - user
      summary: Fetch logged in user
      responses:
        200:
          description: User
          schema:
            $ref: "#/definitions/User"

  /user/tokens:
    get:
      tags:
        - authentication
        - user
      summary: Fetch API tokens for user
      responses:
        200:
          description: API Tokens
          schema:
            type: array
            items:
              $ref: "#/definitions/APIToken"
    post:
      tags:
        - authentication
        - user
      summary: Create an API token
      parameters:
        - name: body
          in: body
          required: false
          schema:
            type: object
            properties:
              name:
                type: string
                example: "my CI token"
      responses:
        201:
          description: API Token
          schema:
            $ref: "#/definitions/APIToken"

  /user/tokens/{api_token_id}:
    parameters:
      - name: api_token_id
        in: path
        type: string
        required: true
        x-example: "kwofd61g93-yuqvex8efmhjkgnbxlo8mp1tin6spyhu="
    delete:
      tags:
        - authentication
        - user
      summary: Expires API token
      responses:
        204:
          description: Expired API Token

  # User Profiles
  /users:
    get:
      tags:
        - user
      summary: Fetches all users
      responses:
        200:
          description: Users
          schema:
            type: array
            items:
              $ref: "#/definitions/User"
    post:
      tags:
        - user
      summary: Creates a user
      consumes:
        - application/json
      parameters:
        - name: User
          in: body
          required: true
          schema:
            $ref: "#/definitions/UserRequest"
      responses:
        400:
          description: User creation failed
        201:
          description: User created
          schema:
            $ref: "#/definitions/User"

  /users/{user_id}/:
    parameters:
      - $ref: "#/parameters/user_id"
    get:
      tags:
        - user
      summary: Fetches a user profile
      responses:
        200:
          description: User profile
          schema:
            $ref: "#/definitions/User"
    put:
      tags:
        - user
      summary: Updates user details
      consumes:
        - application/json
      parameters:
        - name: User
          in: body
          required: true
          schema:
            $ref: "#/definitions/UserPutRequest"
      responses:
        204:
          description: User Updated

    delete:
      tags:
        - user
      summary: Deletes user
      responses:
        204:
          description: User deleted

  /users/{user_id}/password:
    parameters:
      - $ref: "#/parameters/user_id"
    post:
      tags:
        - user
      summary: Updates user password
      consumes:
        - application/json
      parameters:
        - name: Password
          in: body
          required: true
          schema:
            type: object
            properties:
              password:
                type: string
                format: password
      responses:
        204:
          description: Password updated

  /users/{user_id}/2fas/totp:
    parameters:
      - $ref: "#/parameters/user_id"
    post:
      tags:
        - user
      summary: Enable TOTP 2FA for the user
      responses:
        200:
          description: TOTP enabled
          schema:
            type: object

  /users/{user_id}/2fas/totp/{totp_id}/qr:
    parameters:
      - $ref: "#/parameters/user_id"
      - $ref: "#/parameters/totp_id"
    get:
      tags:
        - user
      summary: Get TOTP QR code image
      produces:
        - image/png
      responses:
        200:
          description: QR code image
        404:
          description: TOTP device not found

  /users/{user_id}/2fas/totp/{totp_id}:
    parameters:
      - $ref: "#/parameters/user_id"
      - $ref: "#/parameters/totp_id"
    delete:
      tags:
        - user
      summary: Disable TOTP 2FA for the user
      responses:
        204:
          description: TOTP disabled

  # Projects
  /projects:
    get:
      tags:
        - project
      summary: Get projects
      responses:
        200:
          description: List of projects
          schema:
            type: array
            items:
              $ref: "#/definitions/Project"
    post:
      tags:
        - project
      summary: Create a new project
      consumes:
        - application/json
      parameters:
        - name: Project
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProjectRequest'
      responses:
        201:
          description: Created project
          schema:
            $ref: "#/definitions/Project"
  
  /projects/restore:
    post:
      tags:
        - project
      summary: Restore Project
      consumes:
        - application/json
      parameters:
        - name: Backup
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProjectBackup'
      responses:
        200:
          description: Created project
          schema:
            $ref: "#/definitions/Project"

  /events:
    get:
      summary: Get Events related to Semaphore and projects you are part of
      responses:
        200:
          description: Array of events in chronological order
          schema:
            type: array
            items:
              $ref: '#/definitions/Event'
  
  /events/last:
    get:
      summary: Get last 200 Events related to Semaphore and projects you are part of
      responses:
        200:
          description: Array of events in chronological order
          schema:
            type: array
            items:
              $ref: '#/definitions/Event'

  /project/{project_id}/:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - project
      summary: Fetch project
      responses:
        200:
          description: Project
          schema:
            $ref: "#/definitions/Project"
    put:
      tags:
        - project
      summary: Update project
      parameters:
        - name: Project
          in: body
          required: true
          schema:
            allOf:
              - $ref: '#/definitions/ProjectRequest'
              - properties:
                  id:
                    type: integer
                    minimum: 1
      responses:
        204:
          description: Project saved
    delete:
      tags:
        - project
      summary: Delete project
      responses:
        204:
          description: Project deleted

  /project/{project_id}/backup:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - project
      summary: Backup A Project
      responses:
        200:
          description: Backup
          schema:
            $ref: '#/definitions/ProjectBackup'

  /project/{project_id}/role:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - project
      summary: Fetch permissions of the current user for project
      responses:
        200:
          description: Permissions
          schema:
            type: object
            properties:
              role:
                type: string
                example: owner
              permissions:
                type: number
                example: 0


  /project/{project_id}/events:
    parameters:
      - $ref: '#/parameters/project_id'
    get:
      tags:
        - project
      summary: Get Events related to this project
      responses:
        200:
          description: Array of events in chronological order
          schema:
            type: array
            items:
              $ref: '#/definitions/Event'

  /project/{project_id}/events/last:
    parameters:
      - $ref: '#/parameters/project_id'
    get:
      tags:
        - project
      summary: Get last events related to this project
      responses:
        200:
          description: Array of events in chronological order
          schema:
            type: array
            items:
              $ref: '#/definitions/Event'

  /project/{project_id}/stats:
    parameters:
      - $ref: "#/parameters/project_id"
    get:
      tags:
        - project
      summary: Get task statistics for project
      parameters:
        - name: start
          in: query
          required: false
          type: string
          format: date
        - name: end
          in: query
          required: false
          type: string
          format: date
        - name: user_id
          in: query
          required: false
          type: integer
      responses:
        200:
          description: Task statistics
          schema:
            type: array
            items:
              $ref: "#/definitions/TaskStat"

  /project/{project_id}/me:
    parameters:
      - $ref: "#/parameters/project_id"
    delete:
      tags:
        - project
      summary: Leave project
      responses:
        204:
          description: Left project

  /project/{project_id}/cache:
    parameters:
      - $ref: "#/parameters/project_id"
    delete:
      tags:
        - project
