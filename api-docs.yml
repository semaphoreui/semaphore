    type: object
    properties:
      integrations:
        type: array
        items:
          $ref: "#/definitions/ObjectReferrer"

  TaskStage:
    type: object
    properties:
      id:
        type: integer
      task_id:
        type: integer
      start:
        type: string
        format: date-time
      end:
        type: string
        format: date-time
      start_output_id:
        type: integer
      end_output_id:
        type: integer
      type:
        type: string
        enum: [init, terraform_plan, running, print_result]
      result:
        type: object

  TaskStat:
    type: object
    properties:
      date:
        type: string
      count_by_status:
        type: object
      avg_duration:
        type: integer

  AnsibleTaskHost:
    type: object
    properties:
      id:
        type: integer
      task_id:
        type: integer
      project_id:
        type: integer
      host:
        type: string
      changed:
        type: integer
      failed:
        type: integer
      ignored:
        type: integer
      ok:
        type: integer
      rescued:
        type: integer
      skipped:
        type: integer
      unreachable:
        type: integer
      created:
        type: string
        format: date-time

  AnsibleTaskError:
    type: object
    properties:
      id:
        type: integer
      task_id:
        type: integer
      project_id:
        type: integer
      host:
        type: string
      task:
        type: string
      error:
        type: string
      created:
        type: string
        format: date-time

  TemplateRolePerm:
    type: object
    properties:
      id:
        type: integer
      role_slug:
        type: string
      template_id:
        type: integer
      project_id:
        type: integer
      permissions:
        type: integer

  Role:
    type: object
    properties:
      name:
        type: string
      slug:
        type: string
      project_id:
        type: integer

  Option:
    type: object
    properties:
      key:
        type: string
      value:
        type: string

