version: "3.4"

volumes:
  mariadb:

services:
  server:
    environment:
      FORGE_DB_DIALECT: mysql
      FORGE_DB_HOST: db
      FORGE_DB_PORT: 3306
      FORGE_DB_USER: ${MARIADB_USERNAME:-forge}
      FORGE_DB_PASS: ${MARIADB_PASSWORD:-forge}
      FORGE_DB: ${MARIADB_DATABASE:-forge}
    depends_on:
      - db

  db:
    image: mariadb:10.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT:-root}
      MARIADB_USER: ${MARIADB_USERNAME:-forge}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-forge}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-forge}
    volumes:
      - mariadb:/var/lib/mysql
