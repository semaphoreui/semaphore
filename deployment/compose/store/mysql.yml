version: "3.4"

volumes:
  mysql:

services:
  server:
    environment:
      FORGE_DB_DIALECT: mysql
      FORGE_DB_HOST: db
      FORGE_DB_PORT: 3306
      FORGE_DB_USER: ${MYSQL_USERNAME:-forge}
      FORGE_DB_PASS: ${MYSQL_PASSWORD:-forge}
      FORGE_DB: ${MYSQL_DATABASE:-forge}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-root}
      MYSQL_USER: ${MYSQL_USERNAME:-forge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-forge}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-forge}
    volumes:
      - mysql:/var/lib/mysql
