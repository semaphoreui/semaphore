version: "3.4"

services:
  runner:
    image: docker.io/forgeui/runner:${FORGE_VERSION:-latest}
    restart: always
    environment:
      FORGE_WEB_ROOT: ${FORGE_WEB_ROOT:-http://server:3000}
      FORGE_RUNNER_API_URL: ${FORGE_RUNNER_API_URL:-http://server:3000/internal}
      FORGE_RUNNER_API_TOKEN: ${FORGE_RUNNER_API_TOKEN:-your-api-token-here}

  server:
    environment:
      # No longer needed - API tokens are managed through the web UI
